name: Build Clean Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build EXE with Electron
        run: |
          npm init -y
          npm install electron electron-builder --save-dev
          
          # Create main Electron process entry file
          Set-Content -Path "main.js" -Value @"
          const { app, BrowserWindow } = require('electron');
          function createWindow () {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              webPreferences: { nodeIntegration: true }
            });
            win.setMenu(null);
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          "@

          # Update package.json scripts and builder config
          $package = Get-Content package.json | ConvertFrom-Json
          $package | Add-Member -MemberType NoteProperty -Name "main" -Value "main.js" -Force
          $package | Add-Member -MemberType NoteProperty -Name "build" -Value @{
              appId = "com.nexura.desktop"
              productName = "Nexura"
              win = @{ target = "nsis" }
          } -Force
          $package | ConvertTo-Json -Depth 10 | Set-Content package.json

          # Pack EXE file
          npx electron-builder --win nsis

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Nexura-Windows-Setup
          path: dist/*.exe
