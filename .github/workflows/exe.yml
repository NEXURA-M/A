name: Build Clean Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Package Files
        run: |
          npm init -y
          npm install electron electron-builder --save-dev

      - name: Create Electron Main File
        run: |
          @'
          const { app, BrowserWindow } = require('electron');
          function createWindow () {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              autoHideMenuBar: true,
              webPreferences: { nodeIntegration: true }
            });
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          '@ | Out-File -FilePath main.js -Encoding utf8

      - name: Build Executable
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.main = "main.js"
          $pkg | Add-Member -MemberType NoteProperty -Name "build" -Value @{
            appId = "com.nexura.desktop"
            productName = "Nexura"
            win = @{ target = "portable" }
          } -Force
          $pkg | ConvertTo-Json -Depth 10 | Out-File package.json -Encoding utf8
          npx electron-builder --win portable

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Nexura-Windows-EXE
          path: dist/*.exe
